
{% extends "base.html" %}

{% block title %}{{ action }} Application | Job Application Tracker{% endblock %}

{% block content %}

<div class="card mx-auto" style="max-width: 750px;">
    <div class="card-body p-4">

        <h1 class="fw-bold mb-4">{{ action }} Application</h1>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Job *</label>
                <select name="job_id" class="form-select" required>
                    <option value="">Select a job</option>

                    {% for job in jobs %}
                    <option value="{{ job.job_id }}"
                        {% if application and application.job_id|string == job.job_id|string %}
                        selected
                        {% endif %}>
                        {{ job.job_title }} — {{ job.company_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Application Date *</label>
                <input type="date"
                       name="application_date"
                       class="form-control"
                       value="{{ application.application_date if application else '' }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for status in ['Applied', 'Interview', 'Offer', 'Rejected', 'Withdrawn'] %}
                    <option value="{{ status }}"
                        {% if application and application.status == status %}
                        selected
                        {% endif %}>
                        {{ status }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Resume Version</label>
                <input type="text"
                       name="resume_version"
                       maxlength="50"
                       class="form-control"
                       placeholder="e.g. Resume v2"
                       value="{{ application.resume_version if application and application.resume_version else '' }}">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox"
                       name="cover_letter_sent"
                       class="form-check-input"
                       id="cover_letter_sent"
                       {% if application and application.cover_letter_sent %}checked{% endif %}>
                <label class="form-check-label" for="cover_letter_sent">
                    Cover Letter Sent
                </label>
            </div>

            <div class="mb-3">
                <label class="form-label">Response Date</label>
                <input type="date"
                       name="response_date"
                       class="form-control"
                       value="{{ application.response_date if application and application.response_date else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Interview Date and Time</label>
                <input type="datetime-local"
                       name="interview_date"
                       class="form-control"
                       value="{{ application.interview_date if application and application.interview_date else '' }}">
            </div>

            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea name="notes"
                          rows="4"
                          class="form-control"
                          placeholder="Additional details about the application">{{ application.notes if application and application.notes else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Application
            </button>

            <a href="{{ url_for('applications') }}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>
    </div>
</div>

{% endblock %}
