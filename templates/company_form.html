
{% extends "base.html" %}

{% block title %}{{ action }} Company | Job Application Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card p-4">
            <h2 class="fw-bold mb-4">{{ action }} Company</h2>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Company Name *</label>
                    <input type="text" name="company_name"
                           class="form-control" maxlength="100"
                           value="{{ company.company_name if company else '' }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Industry</label>
                    <input type="text" name="industry"
                           class="form-control" maxlength="50"
                           value="{{ company.industry if company else '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Website</label>
                    <input type="text" name="website"
                           class="form-control" maxlength="200"
                           value="{{ company.website if company else '' }}">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">City</label>
                        <input type="text" name="city"
                               class="form-control" maxlength="50"
                               value="{{ company.city if company else '' }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">State</label>
                        <input type="text" name="state"
                               class="form-control" maxlength="50"
                               value="{{ company.state if company else '' }}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Company
                </button>
                <a href="{{ url_for('companies') }}"
                   class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
