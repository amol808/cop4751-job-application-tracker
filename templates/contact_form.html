
{% extends "base.html" %}

{% block title %}{{ action }} Contact | Job Application Tracker{% endblock %}

{% block content %}

<div class="card mx-auto" style="max-width: 750px;">
    <div class="card-body p-4">

        <h1 class="fw-bold mb-4">{{ action }} Contact</h1>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Company *</label>
                <select name="company_id" class="form-select" required>
                    <option value="">Select a company</option>

                    {% for company in companies %}
                    <option value="{{ company.company_id }}"
                        {% if contact and contact.company_id|string == company.company_id|string %}
                            selected
                        {% endif %}>
                        {{ company.company_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">First Name *</label>
                    <input type="text"
                           name="first_name"
                           class="form-control"
                           maxlength="50"
                           value="{{ contact.first_name if contact else '' }}"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Name *</label>
                    <input type="text"
                           name="last_name"
                           class="form-control"
                           maxlength="50"
                           value="{{ contact.last_name if contact else '' }}"
                           required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       maxlength="100"
                       value="{{ contact.email if contact and contact.email else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel"
                       name="phone"
                       class="form-control"
                       maxlength="20"
                       value="{{ contact.phone if contact and contact.phone else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Job Title</label>
                <input type="text"
                       name="job_title"
                       class="form-control"
                       maxlength="100"
                       value="{{ contact.job_title if contact and contact.job_title else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">LinkedIn URL</label>
                <input type="url"
                       name="linkedin_url"
                       class="form-control"
                       maxlength="200"
                       placeholder="https://www.linkedin.com/in/..."
                       value="{{ contact.linkedin_url if contact and contact.linkedin_url else '' }}">
            </div>

            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea name="notes"
                          class="form-control"
                          rows="4">{{ contact.notes if contact and contact.notes else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Contact
            </button>

            <a href="{{ url_for('contacts') }}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>
    </div>
</div>

{% endblock %}
