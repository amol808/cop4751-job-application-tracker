
{% extends "base.html" %}

{% block title %}Add Job | Job Application Tracker{% endblock %}

{% block content %}

<div class="card mx-auto" style="max-width: 750px;">
    <div class="card-body p-4">

        <h1 class="fw-bold mb-4">{{ action }} Job</h1>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Company *</label>
                <select name="company_id" class="form-select" required>
                    <option value="">Select a company</option>

                    {% for company in companies %}
                    <option value="{{ company.company_id }}"
                        {% if job and job.company_id|string == company.company_id|string %}
                            selected
                        {% endif %}>
                        {{ company.company_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Title *</label>
                <input type="text"
                       name="job_title"
                       class="form-control"
                       maxlength="100"
                       value="{{ job.job_title if job else '' }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea name="job_description"
                          class="form-control"
                          rows="4">{{ job.job_description if job and job.job_description else '' }}</textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Minimum Salary</label>
                    <input type="number"
                           name="salary_min"
                           class="form-control"
                           min="0"
                           step="0.01"
                           value="{{ job.salary_min if job and job.salary_min is not none else '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Maximum Salary</label>
                    <input type="number"
                           name="salary_max"
                           class="form-control"
                           min="0"
                           step="0.01"
                           value="{{ job.salary_max if job and job.salary_max is not none else '' }}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Type</label>
                <select name="job_type" class="form-select">
                    <option value="">Select job type</option>
                    {% for type in ['Full-time', 'Part-time', 'Contract', 'Internship', 'Remote', 'Hybrid'] %}
                    <option value="{{ type }}"
                        {% if job and job.job_type == type %}selected{% endif %}>
                        {{ type }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Posting URL</label>
                <input type="text"
                       name="posting_url"
                       class="form-control"
                       value="{{ job.posting_url if job and job.posting_url else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Date Posted</label>
                <input type="date"
                       name="date_posted"
                       class="form-control"
                       value="{{ job.date_posted if job and job.date_posted else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Job Requirements (JSON)</label>
                <textarea name="requirements"
                          class="form-control"
                          rows="3"
                          placeholder='{"skills": ["Python", "SQL", "Flask"]}'>{{ job.requirements if job and job.requirements else '' }}</textarea>
                <div class="form-text">
                    Optional. Enter valid JSON containing the required skills.
                </div>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox"
                       name="is_active"
                       class="form-check-input"
                       id="is_active"
                       {% if not job or job.is_active %}checked{% endif %}>
                <label class="form-check-label" for="is_active">
                    Active Job
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Job
            </button>

            <a href="{{ url_for('jobs') }}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>
    </div>
</div>

{% endblock %}
